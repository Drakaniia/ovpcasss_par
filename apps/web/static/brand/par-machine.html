<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Post-Activity Report</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(680px,100% - 32px);margin:64px auto 96px}
</style><style>
html,body{background:#faf8f4!important;color-scheme:light;overflow:hidden}
.iso-page{width:100%!important;margin:0!important}
.iso-figure{margin:0!important}
.iso-legend{display:none!important}
.iso-plate{background:transparent!important;box-shadow:none!important;padding:52px 24px!important}
.iso-plate-corner[data-corner="hint"]{bottom:0!important}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>
/* Institutional OVPCASSS palette accents layered onto Anatomy tokens */
.iso {
  --par-navy-fill: #1f3363;
  --par-navy-top: #2c4785;
  --par-navy-edge: #93b4ff;
  --par-gold-fill: #5c4314;
  --par-gold-top: #7d5c1d;
  --par-gold-edge: #d3a44f;
  --par-maroon-fill: #3d1618;
  --par-maroon-top: #521d20;
  --par-maroon-edge: #c96565;
  --par-glass-fill: #192847;
  --par-glass-lit: #8abfff;
}
.iso[data-theme="light"] {
  --anatomy-page: #f5f4f1;
  --anatomy-card: #faf8f4;
  --anatomy-paper: #faf8f4;
  --anatomy-text: #5b6272;
  --anatomy-strong: #14203c;
  --anatomy-muted: #6e7687;
  --anatomy-lit: #0f1a33;
  --anatomy-lit-top: #ffffff;
  --anatomy-lit-shade: #e9edf6;
  --par-navy-fill: #1e2c52;
  --par-navy-top: #2c3f70;
  --par-navy-edge: #0f1a33;
  --par-gold-fill: #e8d5ab;
  --par-gold-top: #f6efdd;
  --par-gold-edge: #b8862b;
  --par-maroon-fill: #f0d2d2;
  --par-maroon-top: #fbeaea;
  --par-maroon-edge: #9e2a2a;
  --par-glass-fill: #e9edf6;
  --par-glass-lit: #1e2c52;
}

/* One filled navy control per station */
.par-navy-control > .iso-solid > .iso-top { fill: var(--par-navy-top); }
.par-navy-control > .iso-solid > .iso-shade { fill: var(--par-navy-fill); }
.par-navy-control > .iso-solid > .iso-edge { stroke: var(--par-navy-edge); stroke-width: 0.75px; }
.par-navy-control { cursor: pointer; }

/* Decorative gold accents (never a button) */
.par-gold-trim > .iso-solid > .iso-top { fill: var(--par-gold-top); }
.par-gold-trim > .iso-solid > .iso-shade { fill: var(--par-gold-fill); }
.par-gold-trim > .iso-solid > .iso-edge { stroke: var(--par-gold-edge); }
.par-gold-trim > .iso-line { stroke: var(--par-gold-edge); }

/* Maroon return chute ("sent back" in workflow contexts) */
.par-maroon-chute > .iso-solid > .iso-top { fill: var(--par-maroon-top); }
.par-maroon-chute > .iso-solid > .iso-shade { fill: var(--par-maroon-fill); }
.par-maroon-chute > .iso-solid > .iso-edge { stroke: var(--par-maroon-edge); }

/* Glass archive cylinder storing finished reports as light */
.par-glass-cylinder > .iso-solid > .iso-fill { fill: var(--par-glass-fill); fill-opacity: 0.42; }
.par-glass-cylinder > .iso-solid > .iso-shade { fill: var(--par-glass-fill); fill-opacity: 0.28; }
.par-glass-cylinder > .iso-solid > .iso-top { fill: var(--par-glass-fill); fill-opacity: 0.52; }
.par-light-disc {
  fill: var(--par-glass-lit);
  fill-opacity: var(--archive-glow, 0.16);
  stroke: var(--par-glass-lit);
  stroke-width: 0.65px;
  vector-effect: non-scaling-stroke;
  transition: fill-opacity 280ms var(--anatomy-ease);
}
.iso-stage[data-approved] .par-light-disc {
  fill-opacity: 0.58;
}

.par-stage {
  cursor: pointer;
  touch-action: pan-y;
}
.par-stage:focus { outline: none; }
.par-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.par-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

const P = {"origin":[322.2139077904593,230.77972245161578],"scale":1.3614510924643517,"azimuth":50,"elevation":30};
const DIAL_X = -18, DIAL_Y = -38, DIAL_R = 23, DIAL_TOP = 61;
const WORKFLOW_STEPS = [{"step":0,"status":"DRAFT","stamped":false,"stampEngagement":0,"gateAngle":0,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-105,0,13.2]],"actionLabel":"Submitter places draft token in intake tray"},{"step":1,"status":"SUBMITTED","stamped":true,"stampEngagement":1,"gateAngle":0,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-105,0,13.2],[-54,0,13.2],[-8,0,13.2]],"actionLabel":"Stamper punches OFF-2026-0001 on first submission"},{"step":2,"status":"RETURNED_BY_REVIEWER","stamped":true,"stampEngagement":0,"gateAngle":1,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-8,0,13.2],[-8,25.5,12.2],[-52,25.5,12.2],[-94,25.5,12.2],[-105,0,13.2]],"actionLabel":"Returned by reviewer via return chute to intake"},{"step":3,"status":"RESUBMITTED","stamped":true,"stampEngagement":0,"gateAngle":0,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-105,0,13.2],[-54,0,13.2],[-8,0,13.2]],"actionLabel":"Resubmitted; stamper locked out, OFF-2026-0001 preserved"},{"step":4,"status":"ENDORSED","stamped":true,"stampEngagement":0,"gateAngle":0,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-8,0,13.2],[24,0,13.2],[56,0,13.2]],"actionLabel":"Endorsed by reviewer; passes under separator bar to approver"},{"step":5,"status":"RETURNED_BY_APPROVER","stamped":true,"stampEngagement":0,"gateAngle":1,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[56,0,13.2],[62,25.5,12.2],[-16,25.5,12.2],[-94,25.5,12.2],[-105,0,13.2]],"actionLabel":"Returned by approver via return chute to intake"},{"step":6,"status":"RESUBMITTED","stamped":true,"stampEngagement":0,"gateAngle":0,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-105,0,13.2],[-54,0,13.2],[-8,0,13.2]],"actionLabel":"Resubmitted after approver return; OFF-2026-0001 preserved"},{"step":7,"status":"ENDORSED","stamped":true,"stampEngagement":0,"gateAngle":0,"sealPress":0,"drawerOpen":0,"archiveLight":0,"tokenWaypoints":[[-8,0,13.2],[24,0,13.2],[56,0,13.2]],"actionLabel":"Re-endorsed to approver seal press"},{"step":8,"status":"APPROVED","stamped":true,"stampEngagement":0,"gateAngle":0,"sealPress":1,"drawerOpen":1,"archiveLight":1,"tokenWaypoints":[[56,0,13.2],[90,0,13.2]],"actionLabel":"Approved and sealed; stored as light in archive cylinder"}];
const DIAL_POSITIONS = [{"status":"DRAFT","index":0,"angleDeg":-135,"short":"DRF","station":"intake","x":-105,"y":0,"z":13.2,"chute":false},{"status":"SUBMITTED","index":1,"angleDeg":-90,"short":"SUB","station":"review","x":-8,"y":0,"z":13.2,"chute":false},{"status":"RESUBMITTED","index":2,"angleDeg":-45,"short":"RSB","station":"review","x":-8,"y":0,"z":13.2,"chute":false},{"status":"RETURNED_BY_REVIEWER","index":3,"angleDeg":0,"short":"RTR","station":"chute-rev","x":-52,"y":25.5,"z":12.2,"chute":true},{"status":"RETURNED_BY_APPROVER","index":4,"angleDeg":45,"short":"RTA","station":"chute-app","x":-16,"y":25.5,"z":12.2,"chute":true},{"status":"ENDORSED","index":5,"angleDeg":90,"short":"END","station":"approve","x":56,"y":0,"z":13.2,"chute":false},{"status":"APPROVED","index":6,"angleDeg":135,"short":"APR","station":"archive","x":96,"y":0,"z":13.2,"chute":false}];
const TRACKING_NUMBER = "OFF-2026-0001";

const stage = document.querySelector(".par-stage");
const svg = stage.querySelector("svg");
const tokenEl = svg.querySelector('[data-part="token"]');
const trackSlot = svg.querySelector('[data-slot="track"]');
const chuteSlot = svg.querySelector('[data-slot="chute"]');
const tokenStampEl = svg.querySelector('[data-part="token-stamp"]');
const tokenBlankEl = svg.querySelector('[data-part="token-blank"]');
const needleEl = svg.querySelector('[data-part="dial-needle"]');
const stampRamEls = [...svg.querySelectorAll('[data-move="stamp-ram"], [data-move="stamp-head"]')];
const stampLatchEl = svg.querySelector('[data-part="stamp-latch"]');

const sealRamEls = [...svg.querySelectorAll('[data-move="seal-ram"], [data-move="seal-die"], [data-move="seal-cap"]')];

const still = matchMedia("(prefers-reduced-motion: reduce)");

function dialAngleRad(status) {
  const found = DIAL_POSITIONS.find((d) => d.status === status);
  return ((found ? found.angleDeg : -135) * Math.PI) / 180;
}

function needlePath(angleRad) {
  const tail = 4.2, tip = DIAL_R - 4.2;
  return lineOnTop(
    [DIAL_X - Math.sin(angleRad) * tail, DIAL_Y + Math.cos(angleRad) * tail],
    [DIAL_X + Math.sin(angleRad) * tip, DIAL_Y - Math.cos(angleRad) * tip],
    DIAL_TOP + 0.25,
    P
  );
}

function samplePath3D(waypoints, t) {
  if (waypoints.length === 1) return waypoints[0];
  const clamped = Math.max(0, Math.min(1, t));
  const segs = waypoints.length - 1;
  const scaled = clamped * segs;
  const idx = Math.min(segs - 1, Math.floor(scaled));
  const f = scaled - idx;
  const s = f * f * (3 - 2 * f);
  const a = waypoints[idx], b = waypoints[idx + 1];
  return [
    a[0] + (b[0] - a[0]) * s,
    a[1] + (b[1] - a[1]) * s,
    a[2] + (b[2] - a[2]) * s,
  ];
}

let stepIndex = 0;
let stepProgress = 1;
let needleSpring = { at: dialAngleRad(WORKFLOW_STEPS[0].status), rate: 0 };
let stampPulse = 0;
let sealStroke = 0;
let drawerSlide = 0;
let gateOpen = 0;
let frame = 0, last = 0, visible = false, touring = !still.matches, stepClock = 0, idleTimer = 0;

function setStep(nextIndex, userDriven = false) {
  stepIndex = (nextIndex + WORKFLOW_STEPS.length) % WORKFLOW_STEPS.length;
  stepProgress = still.matches ? 1 : 0;
  stepClock = 0;
  if (userDriven) {
    touring = false;
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      touring = !still.matches;
      stepClock = 0;
      run();

  const labelText = cur.status + " · " + numText;

  stage.setAttribute("aria-valuetext", labelText + " — " + cur.actionLabel);
  if (srStatus) srStatus.textContent = labelText;
  run();

function draw() {
  const cur = WORKFLOW_STEPS[stepIndex];
  const pos = samplePath3D(cur.tokenWaypoints, stepProgress);
  const wantSlot = pos[1] > 14 ? chuteSlot : trackSlot;
  if (tokenEl.parentNode !== wantSlot) wantSlot.appendChild(tokenEl);
  tokenEl.setAttribute("transform", translateAlong(P, pos));

  tokenBlankEl.style.opacity = showStamp ? "0" : "1";

  const ramTransform = translateAlong(P, [0, 0, ramDz]);
  for (const el of stampRamEls) el.setAttribute("transform", ramTransform);

  for (const el of drawerEls) el.setAttribute("transform", drawerTransform);

    stage.removeAttribute("data-approved");

  const text = cur.status + " · " + numText;

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;

  if (touring && !calm) {

    if (stepClock >= 2.4) {

      stepProgress = 0;
      stepClock = 0;

  const cur = WORKFLOW_STEPS[stepIndex];
  if (calm) {

    stepProgress = Math.min(1, stepProgress + dt / 1.05);

      needleSpring.rate = 0;

    stepProgress >= 1 &&

    Math.abs(needleSpring.rate) < 1e-3 &&
    Math.abs(wantGate - gateOpen) < 1e-3 &&
    Math.abs(wantSeal - sealStroke) < 1e-3 &&
    Math.abs(wantDrawer - drawerSlide) < 1e-3;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();

  { rootMargin: "120px 0px" }
