name = "par"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Serves the apps/web build on the same origin as the API (spec §7.1).
# SPA fallback is handled here, so the Worker never sees unmatched client routes.
# API paths must reach the Worker first: a browser navigation (Google OAuth start,
# downloads) sends Accept: text/html and would otherwise get the SPA fallback.
[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "par-db"
database_id = "0f8f8484-9e44-4341-8913-df8258531c81"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "par-attachments"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "par-email"

[[queues.consumers]]
queue = "par-email"
max_retries = 5
dead_letter_queue = "par-email-dlq"

# Cron times are UTC (18:30 UTC is 02:30 Asia/Manila). The hourly sweep removes
# expired sessions/tokens, closed rate-limit windows, and uploads nothing
# confirmed within 24 hours; the daily job writes the D1 export to R2
# (spec §7.1, §7.8, §10). Keep these in step with apps/api/src/cron/scheduled.ts.
[triggers]
crons = ["17 * * * *", "30 18 * * *"]

[vars]
# Addresses that become an active Admin once their email is verified, instead of
# the default personnel-in-charge role. Keep it short; remove an entry after the
# account is set up.
BOOTSTRAP_ADMIN_EMAILS = "ovpcasss@buksu.edu.ph,2401117078@student.buksu.edu.ph"
R2_BUCKET_NAME = "par-attachments"
# The office mailbox: default workbook recipient and failure-digest fallback.
OFFICE_EMAIL = "ovpcasss@buksu.edu.ph"
# The deployed app's origin. Cron-composed mail (the reminder sweep, the failure
# digest) is written outside a request and needs it to link back; request-driven
# mail uses the request's own origin and does not need it. The Worker serves the
# SPA on the same origin (see [assets]), so this is the worker's public URL.
# The host is the account's workers.dev subdomain, not the script name: a rename
# of the account subdomain changes every Worker URL. Change it when the app moves
# to a custom domain. Locally, .dev.vars wins.
APP_ORIGIN = "https://par.ovpcasss.workers.dev"
# OVPCASSS-F-013 signatory block; defaults to the printed form.
# RECEIPT_SIGNATORY_NAME = "DR. LINCOLN V. TAN"
# RECEIPT_SIGNATORY_TITLE = "VPCASSS"
EMAIL_MAX_ATTACHMENT_BYTES = "8388608"
EMAIL_PROVIDER = "resend"
# Sender for outbound mail: an address at the domain verified in Resend
# (`send.buksu.edu.ph`, spec §14 Q15). Resend rejects every message with a 403
# until that domain's DNS records are verified, so this address must sit on the
# verified domain — a root-domain sender is refused even though the subdomain is
# verified. Replies are not read; the shell prints a do-not-reply notice (D3).
EMAIL_FROM = "OVPCASSS PAR <no-reply@send.buksu.edu.ph>"
