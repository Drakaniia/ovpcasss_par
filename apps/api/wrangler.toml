name = "par"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Serves the apps/web build on the same origin as the API (spec §7.1).
# SPA fallback is handled here, so the Worker never sees unmatched client routes.
# API paths must reach the Worker first: a browser navigation (Google OAuth start,
# downloads) sends Accept: text/html and would otherwise get the SPA fallback.
[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "par-db"
database_id = "0f8f8484-9e44-4341-8913-df8258531c81"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "par-attachments"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "par-email"

[[queues.consumers]]
queue = "par-email"
max_retries = 5
dead_letter_queue = "par-email-dlq"

# Cron times are UTC (18:30 UTC is 02:30 Asia/Manila). The hourly sweep removes
# expired sessions/tokens, closed rate-limit windows, and uploads nothing
# confirmed within 24 hours; the daily job writes the D1 export to R2
# (spec §7.1, §7.8, §10). Keep these in step with apps/api/src/cron/scheduled.ts.
[triggers]
crons = ["17 * * * *", "30 18 * * *"]

[vars]
# Addresses that become an active Admin once their email is verified, instead of
# the default personnel-in-charge role. Keep it short; remove an entry after the
# account is set up.
BOOTSTRAP_ADMIN_EMAILS = "ovpcasss@buksu.edu.ph,2401117078@student.buksu.edu.ph"
R2_BUCKET_NAME = "par-attachments"
# The office mailbox: default workbook recipient and failure-digest fallback.
OFFICE_EMAIL = "ovpcasss@buksu.edu.ph"
# The address the browser uses: the Pages site, whose `/api/*` Function proxies
# to this Worker (apps/web/functions). Mailed links, receipts, and the Google
# redirect URI are built from it, so a custom domain edits this line, the Pages
# project domain, and the Google client together. Locally, .dev.vars wins. The
# Worker still serves the app on its own origin as the rollback path.
APP_ORIGIN = "https://ovpcasss-par.pages.dev"
# OVPCASSS-F-013 signatory block; defaults to the printed form.
# RECEIPT_SIGNATORY_NAME = "DR. LINCOLN V. TAN"
# RECEIPT_SIGNATORY_TITLE = "VPCASSS"
# Address suggestions for the location field (bug phase 04 §3.2). Photon is
# keyless and runs on OpenStreetMap data; `{q}` is the encoded query, and the
# lat/lon pair biases results toward Malaybalay City. Swap the template for a
# keyed provider (with `{key}`) or remove the line to offer only the office's own
# history. Only the typed text leaves the Worker.
LOCATION_SUGGEST_URL = "https://photon.komoot.io/api/?q={q}&limit=6&lang=en&lat=8.1575&lon=125.1286"
EMAIL_MAX_ATTACHMENT_BYTES = "8388608"
# Brevo, not Resend: send.buksu.edu.ph is still unverified at Resend, which
# refuses every recipient but the account owner. Brevo verifies one sender
# address instead of a domain, so a PIC, a submitter and the office each get
# their own copy with no DNS (runbook email-delivery.md). Every message goes to
# the address on its own outbox row; nothing is redirected.
EMAIL_PROVIDER = "brevo"
# A mailbox confirmed under Senders in the Brevo dashboard. Restore
# no-reply@send.buksu.edu.ph once that domain verifies at Resend.
EMAIL_FROM = "OVPCASSS PAR <floresaybaez574@gmail.com>"
# Replies reach the office; the sending address above is never read.
EMAIL_REPLY_TO = "ovpcasss@buksu.edu.ph"
