name = "par-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Serves the apps/web build on the same origin as the API (spec §7.1).
# SPA fallback is handled here, so the Worker never sees unmatched client routes.
# API paths must reach the Worker first: a browser navigation (Google OAuth start,
# downloads) sends Accept: text/html and would otherwise get the SPA fallback.
[assets]
directory = "../web/build"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "par-db"
database_id = "0f8f8484-9e44-4341-8913-df8258531c81"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "par-attachments"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "par-email"

[[queues.consumers]]
queue = "par-email"
max_retries = 5
dead_letter_queue = "par-email-dlq"

# Cron times are UTC (18:30 UTC is 02:30 Asia/Manila). The hourly sweep removes
# expired sessions/tokens, closed rate-limit windows, and uploads nothing
# confirmed within 24 hours; the daily job writes the D1 export to R2
# (spec §7.1, §7.8, §10). Keep these in step with apps/api/src/cron/scheduled.ts.
[triggers]
crons = ["17 * * * *", "30 18 * * *"]

[vars]
ALLOWED_EMAIL_DOMAINS = "buksu.edu.ph,student.buksu.edu.ph"
# Addresses that skip role approval and start as an active Admin once their email
# is verified. Keep it short; remove an entry after the account is set up.
BOOTSTRAP_ADMIN_EMAILS = "ovpcasss@buksu.edu.ph,2401117078@student.buksu.edu.ph"
R2_BUCKET_NAME = "par-attachments"
# The office mailbox: default workbook recipient and failure-digest fallback.
OFFICE_EMAIL = "ovpcasss@buksu.edu.ph"
# Set APP_ORIGIN to the deployed origin (e.g. https://<worker>.<account>.workers.dev)
# so cron-composed mail (reminders, failure digest) can link back. Request-driven
# mail uses the request's own origin and does not need it.
# APP_ORIGIN = "https://<origin>"
REMINDER_AFTER_WORKING_DAYS = "3"
REMINDER_LOCAL_HOUR = "9"
EMAIL_MAX_ATTACHMENT_BYTES = "8388608"
EMAIL_PROVIDER = "resend"
# Sender for outbound mail. Resend's test sender only reaches the account
# owner; replace it with the verified sending domain before launch (spec §14 Q15).
EMAIL_FROM = "OVPCASSS PAR <ovpcasss@buksu.edu.ph>"
